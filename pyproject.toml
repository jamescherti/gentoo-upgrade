[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gentoo-upgrade"
version = "0.9.9"
description = "Upgrade Gentoo Linux."
readme = "README.md"
requires-python = ">=3.11, <4"
license = "GPL-3.0-or-later"
authors = [
  { name = "James Cherti" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = [
  "psutil",
  "PyYAML",
]

[project.urls]
Homepage = "https://github.com/jamescherti/gentoo-upgrade"
Repository = "https://github.com/jamescherti/gentoo-upgrade"
Issues = "https://github.com/jamescherti/gentoo-upgrade/issues"

[tool.setuptools]
packages = []
py-modules = []
script-files = ["gentoo-upgrade"]
